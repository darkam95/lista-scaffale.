<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista scaffale</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: colonna singola da telefono, righe alte da toccare con il pollice */
:root{
  --bg:#f3f6f6; --card:#ffffff; --fg:#14282b; --muted:#5d7073; --line:#d5e0e1;
  --accent:#0f766e; --accent-fg:#ffffff; --done:#9fb2b4;
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1b1d; --card:#172a2d; --fg:#e6f0f0; --muted:#8fa6a8; --line:#27413f;
  --accent:#2dd4bf; --accent-fg:#06201d; --done:#5a7274; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1b1d; --card:#172a2d; --fg:#e6f0f0; --muted:#8fa6a8; --line:#27413f;
  --accent:#2dd4bf; --accent-fg:#06201d; --done:#5a7274; color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-size:22px;margin:0;font-weight:700}
#count{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li label{display:flex;align-items:center;gap:14px;min-height:60px;padding:10px 14px;
  background:var(--card);border:1px solid var(--line);border-radius:10px;cursor:pointer}
li input{appearance:none;flex:none;width:28px;height:28px;margin:0;border:2px solid var(--muted);
  border-radius:7px;display:grid;place-content:center;background:transparent}
li input:checked{background:var(--accent);border-color:var(--accent)}
li input:checked::after{content:"";width:8px;height:14px;border:solid var(--accent-fg);
  border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
li input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.q{flex:none;min-width:2.4em;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.n{min-width:0;overflow-wrap:anywhere;line-height:1.25}
li.done .n,li.done .q{color:var(--done);text-decoration:line-through}
li.done label{background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:600;padding:12px 16px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--fg);cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.msg{color:var(--muted);line-height:1.45;margin:0}
code{overflow-wrap:anywhere}
</style>
</head><body>
<main>
  <header><h1>Lista scaffale</h1><span id="count"></span></header>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  <p class="msg" id="msg" hidden></p>
  <ul id="list"></ul>
  <div class="row"><button id="reset" type="button">Deseleziona tutto</button></div>
</main>
<script>
// Lista codificata nel frammento dell'indirizzo: alfabeto A-Za-z0-9- (63 simboli), base 63.
var AL='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-';
function enc(text){
  var b=new TextEncoder().encode(text),n=1n;
  for(var i=0;i<b.length;i++)n=n*256n+BigInt(b[i]);
  var s='';while(n>0n){s=AL[Number(n%63n)]+s;n=n/63n}
  return s;
}
function dec(s){
  var n=0n;
  for(var i=0;i<s.length;i++){var k=AL.indexOf(s[i]);if(k<0)throw 0;n=n*63n+BigInt(k)}
  var a=[];while(n>1n){a.unshift(Number(n%256n));n=n/256n}
  return new TextDecoder().decode(new Uint8Array(a));
}
var DEMO='2 x EUTIROX 50 MCG\n1 x TACHIPIRINA 1000 MG\n3 x LANTUS SOLOSTAR 100 U/ML\n1 x KEPPRA 500 MG';
var raw=decodeURIComponent(location.hash.replace(/^#/,'')),text=DEMO,isDemo=true;
if(raw){try{var t=dec(raw);if(t.trim()){text=t;isDemo=false}}catch(e){}}
var items=text.split('\n').map(function(l){return l.trim()}).filter(Boolean).map(function(l){
  var m=l.match(/^(\d+)\s*[x×]\s*(.+)$/i);return m?{q:m[1],n:m[2]}:{q:'',n:l}});
var key='lista:'+(isDemo?'demo':raw),st={};
try{st=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify(st))}catch(e){}}
var ul=document.getElementById('list');
items.forEach(function(it,i){
  var li=document.createElement('li'),lb=document.createElement('label'),cb=document.createElement('input');
  cb.type='checkbox';cb.id='c'+i;cb.checked=!!st[i];
  var q=document.createElement('span');q.className='q';q.textContent=it.q?it.q+'×':'';
  var n=document.createElement('span');n.className='n';n.textContent=it.n;
  lb.append(cb,q,n);li.appendChild(lb);ul.appendChild(li);
  cb.addEventListener('change',function(){st[i]=cb.checked;save();paint()});
});
function paint(){
  var d=0;ul.querySelectorAll('li').forEach(function(li,i){
    var c=li.querySelector('input').checked;li.classList.toggle('done',c);if(c)d++});
  document.getElementById('count').textContent=d+' / '+items.length;
  document.getElementById('bar').style.width=(items.length?100*d/items.length:0)+'%';
}
document.getElementById('reset').addEventListener('click',function(){
  st={};save();ul.querySelectorAll('input').forEach(function(c){c.checked=false});paint()});
if(isDemo){var m=document.getElementById('msg');m.hidden=false;
  m.textContent='Esempio. Apri questa pagina dal QR del calcolatore per vedere la tua lista.'}
paint();
</script>
</body></html>
